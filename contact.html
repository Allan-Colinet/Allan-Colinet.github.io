<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProxySafe | Ajouter le contact</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <meta http-equiv="refresh" content="2; url='/contact.vcf'">

    <style>
        /* On reprend TES variables exactes */
        :root {
            --navy-blue: #0a192f;
            --navy-light: #112240;
            --cyan-tech: #00b4d8;
            --cyan-hover: #0077b6;
            --bg-light: #f9fafb;
            --bg-white: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #e5e7eb;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Réutilisation de ton système de pattern */
        .with-pattern {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .with-pattern::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("pattern_safe.png");
            background-attachment: fixed;
            background-size: cover;
            opacity: 0.1;
            z-index: 0;
        }

        .contact-card {
            position: relative;
            z-index: 10;
            background: var(--bg-white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-top: 4px solid var(--cyan-tech);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        .logo-small {
            height: 80px;
            margin-bottom: 20px;
        }

        h1 { color: var(--navy-blue); font-size: 1.5rem; margin-bottom: 10px; }
        p { color: var(--text-muted); margin-bottom: 25px; }

        .btn {
            display: inline-block;
            background-color: var(--cyan-tech);
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 180, 216, 0.3);
        }
        .btn:hover {
            background-color: var(--cyan-hover);
            transform: translateY(-2px);
        }

        footer {
            background-color: var(--navy-blue);
            padding: 20px;
            text-align: center;
            color: #a0aec0;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="with-pattern">
        <div class="contact-card">
            <img src="logo_proxysafe.png" alt="ProxySafe" class="logo-small">
            <h1>Ajouter Allan Colinet</h1>
            <p>Le téléchargement de la fiche contact va démarrer automatiquement...</p>
            
            <a href="/contact.vcf" class="btn">📩 Enregistrer le contact</a>
            
            <div style="margin-top: 30px; font-size: 0.9rem; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <a href="/" style="color: var(--cyan-tech); text-decoration: none;">← Retour au site proxysafe.be</a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 ProxySafe - Sécurité & GRC de proximité.
    </footer>

</body>
</html>
